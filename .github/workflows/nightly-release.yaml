name: Nightly Release
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Custom tag (optional, will use "nightly" if not provided)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  check-date:
    name: Check latest commit
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check for commits in the last 24 hours
        id: check
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          test -n "$(git rev-list --after='24 hours' "$COMMIT_SHA")" \
            && echo "should_run=true" >>"$GITHUB_OUTPUT" \
            || echo "should_run=false" >>"$GITHUB_OUTPUT"
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    needs: [check-date]
    if: ${{ needs.check-date.outputs.should_run == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          install-mode: goinstall
          version: v2.12.2
      - name: Test
        run: go test ./...
  build-docker:
    name: Build and release Docker image
    runs-on: ubuntu-latest
    needs: [check-date, test]
    if: ${{ needs.check-date.outputs.should_run == 'true' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login into DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate short hash and set tag
        env:
          COMMIT_SHA: ${{ github.sha }}
          CUSTOM_TAG: ${{ inputs.custom_tag }}
        run: |
          echo "SHORT_HASH=${COMMIT_SHA:0:7}" >>"$GITHUB_ENV"
          echo "TAG_NAME=${CUSTOM_TAG:-nightly}" >>"$GITHUB_ENV"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.SHORT_HASH }}
            ghcr.io/${{ github.repository }}:${{ env.TAG_NAME }}
            ${{ github.repository }}:${{ env.SHORT_HASH }}
            ${{ github.repository }}:${{ env.TAG_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
